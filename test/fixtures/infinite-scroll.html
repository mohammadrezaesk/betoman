<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Betoman Test — Infinite scroll</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 24px; }
      #list { margin-top: 16px; }
      .item { padding: 12px; border-bottom: 1px solid #eee; }
      .price { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Infinite scroll simulator</h1>
    <p>Scroll down — new <code>.price</code> items load every few seconds.</p>
    <div id="list"></div>
    <script>
      let n = 0;
      const list = document.getElementById("list");

      function addItem() {
        n++;
        const div = document.createElement("div");
        div.className = "item";
        const price = n % 3 === 0 ? `$${(n * 100).toLocaleString("en-US")}` : `$${(n * 9.99).toFixed(2)}`;
        div.innerHTML = `<span>Product ${n}</span> — <span class="price">${price}</span>`;
        list.appendChild(div);
      }

      for (let i = 0; i < 5; i++) addItem();

      let batch = 0;
      window.addEventListener("scroll", () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100 && batch < 5) {
          batch++;
          for (let i = 0; i < 4; i++) addItem();
        }
      });
    </script>
  </body>
</html>
